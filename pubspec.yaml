name: brainbox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  path: ^1.9.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  go_router: ^14.2.0
  provider: ^6.1.2
  app_links: ^6.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/lessons/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-VariableFont_wght.ttf
        - asset: fonts/SpaceGrotesk-VariableFont_wght.ttf
          weight: 700
